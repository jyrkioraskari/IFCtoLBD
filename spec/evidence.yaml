open_questions:
  SID-Q001:
    status: conflicting
    observation: >-
      StableGuidUriPolicy currently delegates resources without a GlobalId to
      LegacyUriPolicy, which does not provide the stated cross-revision guarantee.
  SID-Q002:
    status: conflicting
    observation: >-
      GuidCompressor currently ignores decode failure and formats the zero-valued
      GUID; this is observable but is not accepted as intended behaviour.
  SID-Q003:
    status: unchecked

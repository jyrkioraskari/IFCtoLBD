[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-extractor"
version = "0.1.0"
description = "Summarise building elements (materials, material layers, property sets, IFC attributes) from IFCtoLBD Linked Building Data Turtle as JSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "rdflib>=7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
product-extractor = "product_extractor.cli:main"

[tool.setuptools.packages.find]
include = ["product_extractor*"]

[tool.setuptools.package-data]
product_extractor = ["webui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
